<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiéreme — Emotion as Fragrance</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Inter:wght@200;300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --black: #050505;
      --ivory: #F5F1EA;
      --gold: #C9A45C;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: var(--sans);
      font-weight: 300;
      overflow-x: hidden;
      cursor: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: inherit;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 5000;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: .4;
      mix-blend-mode: overlay;
    }

    /* ── CURSOR ── */
    #csr {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    #csr-ring {
      width: 30px;
      height: 30px;
      border: .5px solid rgba(201, 164, 92, .55);
      border-radius: 50%;
      transition: transform .6s var(--ease), opacity .4s;
    }

    #csr-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    body:has(button:hover) #csr-ring,
    body:has(a:hover) #csr-ring {
      transform: scale(2.2);
      opacity: .22;
    }

    /* ── VEIL ── */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #veil-bar {
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .5s var(--ease);
      box-shadow: 0 0 16px 2px var(--gold);
    }

    #veil-fill {
      position: absolute;
      inset: 0;
      background: var(--black);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .4s var(--ease) .5s;
    }

    #veil.fracture #veil-bar {
      transform: scaleX(1);
    }

    #veil.fill #veil-fill {
      transform: scaleY(1);
    }

    #veil.clear {
      opacity: 0;
      transition: opacity .5s .2s;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 4.5rem;
      transition: padding .4s, background .4s;
    }

    nav.cnd {
      padding: 1rem 4.5rem;
      background: rgba(5, 5, 5, .97);
      border-bottom: 1px solid rgba(201, 164, 92, .12);
    }

    .nav-logo {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: .45em;
      background: linear-gradient(135deg, #f0d880 0%, #c9a45c 40%, #a07030 70%, #d4b56a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-mid {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-mid a {
      font-size: .72rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(245, 241, 234, .85);
      transition: color .35s;
    }

    .nav-mid a:hover {
      color: var(--gold);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-bag {
      background: none;
      border: none;
      cursor: none;
      font-size: .72rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(245, 241, 234, .85);
      display: flex;
      align-items: center;
      gap: .6rem;
      transition: color .3s;
    }

    .nav-bag:hover {
      color: var(--gold);
    }

    .bag-ct {
      width: 18px;
      height: 18px;
      background: var(--gold);
      color: var(--black);
      border-radius: 50%;
      font-size: .52rem;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 400;
    }

    .bag-ct.show {
      display: flex;
    }

    .nav-ham {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: none;
    }

    .nav-ham span {
      display: block;
      width: 22px;
      height: .5px;
      background: rgba(245, 241, 234, .7);
      transition: all .35s;
    }

    .nav-ham.x span:nth-child(1) {
      transform: translateY(5.5px) rotate(45deg);
    }

    .nav-ham.x span:nth-child(2) {
      opacity: 0;
    }

    .nav-ham.x span:nth-child(3) {
      transform: translateY(-5.5px) rotate(-45deg);
    }

    .mob {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 5, .98);
      z-index: 790;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s;
    }

    .mob.open {
      opacity: 1;
      pointer-events: all;
    }

    .mob a,
    .mob .mob-bag {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 2.4rem;
      letter-spacing: .05em;
      color: rgba(245, 241, 234, .7);
      transition: color .3s;
      background: none;
      border: none;
      cursor: none;
    }

    .mob a:hover,
    .mob .mob-bag:hover {
      color: var(--ivory);
    }

    /* ── HERO ── */
    #hero {
      position: relative;
      height: 100svh;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: #050505;
      transition: background 1.6s ease;
    }

    #hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: .5;
    }

    .hero-fog {
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: background 1.6s ease;
      pointer-events: none;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 45%, rgba(5, 5, 5, .65) 100%);
      pointer-events: none;
    }

    .hero-upper {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 2rem;
      margin-top: 8.5rem;
      flex-shrink: 0;
    }

    .hero-eyebrow {
      font-size: .7rem;
      letter-spacing: .55em;
      text-transform: uppercase;
      color: rgba(201, 164, 92, .9);
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: riseIn 1.2s var(--ease) .3s forwards;
    }

    .hero-wm {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(4rem, 11vw, 10rem);
      line-height: .88;
      letter-spacing: .05em;
      color: var(--ivory);
      opacity: 0;
      animation: riseIn 1.4s var(--ease) .55s forwards;
    }

    .hero-fn {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.6rem, 4.5vw, 3.2rem);
      letter-spacing: .04em;
      margin-top: 1.2rem;
      transition: color 1.4s ease;
      opacity: 0;
      animation: riseIn 1.4s var(--ease) .85s forwards;
    }

    .hero-q {
      font-size: .95rem;
      letter-spacing: .05em;
      line-height: 1.75;
      color: rgba(245, 241, 234, .75);
      margin-top: 1.4rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      animation: riseIn 1.4s var(--ease) 1.1s forwards;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: .9rem;
      margin-top: 2.2rem;
      font-size: .72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: none;
      transition: color 1.4s ease;
      opacity: 0;
      animation: riseIn 1.4s var(--ease) 1.3s forwards;
    }

    .hero-cta::after {
      content: '';
      display: block;
      width: 28px;
      height: .5px;
      background: currentColor;
      transition: width .4s;
    }

    .hero-cta:hover::after {
      width: 52px;
    }

    .hero-lower {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 60%;
      width: min(48%, 380px);
      z-index: 2;
      opacity: 0;
      transition: opacity 2.2s ease 1.5s;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hero-lower.show {
      opacity: 1;
    }

    .hero-lower img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, .55) 22%, black 48%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, .55) 22%, black 48%, black 100%);
      filter: brightness(.9) contrast(1.08) saturate(1.02);
    }

    .hero-counter {
      position: absolute;
      bottom: 2.5rem;
      right: 4.5rem;
      z-index: 3;
      font-size: .65rem;
      letter-spacing: .25em;
      color: rgba(245, 241, 234, .45);
      opacity: 0;
      animation: riseIn 1s var(--ease) 1.8s forwards;
    }

    .hero-scroll {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .8rem;
      opacity: 0;
      animation: riseIn 1s var(--ease) 2.1s forwards;
    }

    .hero-scroll p {
      font-size: .62rem;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: rgba(245, 241, 234, .5);
    }

    .hero-sl {
      width: .5px;
      height: 44px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .4;
      }

      50% {
        opacity: .9;
        transform: scaleY(1.2);
      }
    }

    /* ── TODAY ── */
    #today {
      background: linear-gradient(135deg, #0e0a06 0%, #0a0810 40%, #060c0a 70%, #0c0a06 100%);
      padding: 6rem 5rem;
      border-top: 1px solid rgba(201, 164, 92, .1);
      border-bottom: 1px solid rgba(201, 164, 92, .1);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      gap: 4rem;
    }

    .today-lbl {
      font-size: .65rem;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: rgba(201, 164, 92, .8);
    }

    .today-c {
      text-align: center;
    }

    .today-c h2 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 1;
      color: var(--ivory);
    }

    .today-c h2 em {
      font-style: italic;
      background: linear-gradient(135deg, #f5e090 0%, #c9a45c 45%, #8c6020 80%, #d4b56a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .today-c p {
      font-size: .95rem;
      letter-spacing: .04em;
      color: rgba(245, 241, 234, .78);
      margin-top: 1rem;
      line-height: 1.7;
    }

    .today-r {
      text-align: right;
    }

    .today-btn {
      background: none;
      border: .5px solid rgba(201, 164, 92, .4);
      color: var(--gold);
      font-size: .68rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      padding: .9rem 2rem;
      cursor: none;
      transition: all .35s;
    }

    .today-btn:hover {
      background: rgba(201, 164, 92, .1);
      border-color: var(--gold);
    }

    /* ── DIVIDER ── */
    .srule {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 4.5rem;
      opacity: .25;
    }

    .sl {
      flex: 1;
      height: .5px;
      background: var(--gold);
    }

    .sd {
      width: 7px;
      height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* ── COLLECTION HEADERS ── */
    .col-sec {
      padding: 0;
    }

    .col-hdr {
      padding: 9rem 4.5rem 5rem;
      position: relative;
      overflow: hidden;
    }

    .col-hdr::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .col-night {
      background: linear-gradient(180deg, #050505 0%, #0e0306 18%, #180408 35%, #120208 55%, #080205 75%, #050505 100%);
    }

    .col-night .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 10% 55%, rgba(120, 8, 28, .55) 0%, transparent 60%), radial-gradient(ellipse 40% 50% at 90% 80%, rgba(80, 5, 18, .3) 0%, transparent 55%);
    }

    .col-floral {
      background: linear-gradient(180deg, #050505 0%, #0e0e06 18%, #14120a 35%, #100e08 55%, #080806 75%, #050505 100%);
    }

    .col-floral .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 88% 35%, rgba(220, 185, 100, .22) 0%, transparent 60%), radial-gradient(ellipse 40% 50% at 10% 70%, rgba(180, 150, 80, .12) 0%, transparent 55%);
    }

    .col-atmos {
      background: linear-gradient(180deg, #050505 0%, #030a10 18%, #041218 35%, #050e12 55%, #040808 75%, #050505 100%);
    }

    .col-atmos .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 35% 65%, rgba(15, 70, 60, .5) 0%, transparent 60%), radial-gradient(ellipse 40% 50% at 80% 20%, rgba(10, 50, 70, .3) 0%, transparent 55%);
    }

    .col-cozy {
      background: linear-gradient(180deg, #050505 0%, #100c04 18%, #181006 35%, #120e06 55%, #0a0804 75%, #050505 100%);
    }

    .col-cozy .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 65% 38%, rgba(200, 140, 50, .32) 0%, transparent 60%), radial-gradient(ellipse 40% 50% at 15% 80%, rgba(160, 100, 30, .2) 0%, transparent 55%);
    }

    .col-emo {
      background: linear-gradient(180deg, #050505 0%, #120e04 18%, #1a1206 35%, #141006 55%, #0c0a04 75%, #050505 100%);
    }

    .col-emo .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 50% 45%, rgba(200, 160, 40, .28) 0%, transparent 60%), radial-gradient(ellipse 40% 50% at 85% 85%, rgba(160, 120, 20, .18) 0%, transparent 55%);
    }

    .col-heart {
      background: linear-gradient(180deg, #050505 0%, #140208 18%, #1e0408 35%, #180306 55%, #0e0305 75%, #050505 100%);
    }

    .col-heart .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 20% 50%, rgba(130, 8, 30, .6) 0%, transparent 58%), radial-gradient(ellipse 40% 50% at 88% 70%, rgba(90, 5, 20, .35) 0%, transparent 55%);
    }

    .col-intimate {
      background: linear-gradient(180deg, #050505 0%, #120608 18%, #1a0a0e 35%, #140810 55%, #0e0608 75%, #050505 100%);
    }

    .col-intimate .col-hdr::before {
      background: radial-gradient(ellipse 70% 80% at 72% 50%, rgba(180, 80, 100, .32) 0%, transparent 58%), radial-gradient(ellipse 40% 50% at 15% 75%, rgba(140, 60, 80, .2) 0%, transparent 55%);
    }

    .col-n {
      font-size: .65rem;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: rgba(201, 164, 92, .85);
      display: block;
      margin-bottom: 2rem;
    }

    .col-t {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.8rem, 8vw, 6.5rem);
      line-height: .9;
      color: var(--ivory);
    }

    .col-t em {
      font-style: italic;
      background: linear-gradient(135deg, #f5e090 0%, #c9a45c 45%, #8c6020 80%, #d4b56a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .col-sub {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.15rem;
      color: rgba(245, 241, 234, .72);
      margin-top: 2rem;
      letter-spacing: .05em;
    }

    /* ── FRAGRANCE ARCHIVE ── */
    .frag-archive {
      padding: 0 4.5rem 7rem;
    }

    .fe {
      display: grid;
      grid-template-columns: 3.5rem 1fr auto;
      align-items: center;
      gap: 3rem;
      padding: 2.2rem 0;
      border-bottom: .5px solid rgba(245, 241, 234, .1);
      cursor: none;
      position: relative;
      transition: border-color .4s;
    }

    .fe::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: rgba(201, 164, 92, .045);
      transition: width .55s var(--ease);
    }

    .fe:hover::before {
      width: 100%;
    }

    .fe-n {
      font-size: .65rem;
      letter-spacing: .28em;
      color: rgba(201, 164, 92, .82);
      padding-top: .2rem;
    }

    .fe-b {
      min-width: 0;
    }

    .fe-name {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(1.9rem, 3.8vw, 2.8rem);
      line-height: 1.05;
      color: var(--ivory);
      transition: color .3s;
    }

    .fe:hover .fe-name {
      background: linear-gradient(135deg, #f5e090 0%, #c9a45c 50%, #8c6020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .fe-tr {
      font-family: var(--serif);
      font-style: italic;
      font-size: .95rem;
      color: rgba(245, 241, 234, .72);
      letter-spacing: .08em;
      margin-top: .4rem;
    }

    .fe-q {
      font-size: .95rem;
      letter-spacing: .03em;
      color: rgba(245, 241, 234, .72);
      margin-top: .7rem;
      line-height: 1.7;
      max-width: 540px;
    }

    .fe-r {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      flex-shrink: 0;
    }

    .fe-price {
      font-family: var(--serif);
      font-size: 1.35rem;
      color: rgba(245, 241, 234, .7);
    }

    .fe-enter {
      background: none;
      border: none;
      cursor: none;
      font-size: .65rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(201, 164, 92, .85);
      display: flex;
      align-items: center;
      gap: .55rem;
      transition: color .3s;
      white-space: nowrap;
    }

    .fe-enter::after {
      content: '';
      display: block;
      width: 18px;
      height: .5px;
      background: currentColor;
      transition: width .35s;
    }

    .fe:hover .fe-enter {
      color: var(--gold);
    }

    .fe:hover .fe-enter::after {
      width: 36px;
    }

    /* ── HOVER IMAGE PREVIEW ── */
    #img-preview {
      position: fixed;
      z-index: 700;
      width: 210px;
      height: 270px;
      opacity: 0;
      transition: opacity .4s ease;
      pointer-events: none;
      overflow: hidden;
      border: .5px solid rgba(201, 164, 92, .2);
      background: #080605;
    }

    #img-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(.88) contrast(1.05);
    }

    /* ── PHILOSOPHY ── */
    #philosophy {
      padding: 13rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-top: .5px solid rgba(201, 164, 92, .07);
    }

    #philosophy::before {
      content: 'Quiéreme';
      font-family: var(--serif);
      position: absolute;
      font-size: min(28vw, 240px);
      line-height: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(201, 164, 92, .025);
      pointer-events: none;
      white-space: nowrap;
    }

    .phil {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      line-height: 1.55;
      color: rgba(245, 241, 234, .88);

    .pw {

      opacity: 0;
      pointer-events: none;

      cursor: none;

      background: none;
      border: none;
      cursor: none;
      color: rgba(245, 241, 234, .55);

      line-height: 1;

    .cp-back:hover {
      color: var(--gold);

    .chk-ok {
      text-align: center;
      padding: 3.5rem 1rem 2rem;

    let eqStep='q1',
    eqChoice=null;

    function openQuiz() {
      eqStep='q1';
      eqChoice=null;
      renderEQ();
      oPanel('qzp');
    }

    function renderEQ() {
      const isQ1=eqStep==='q1';
      const qData=isQ1?EQ.q1: EQ.q2[eqChoice];
      const prog=isQ1 ?'<div class="qz-prog"><div class="qz-dot on"></div><div class="qz-dot"></div></div>'
      : '<div class="qz-prog"><div class="qz-dot on"></div><div class="qz-dot on"></div></div>';

      document.getElementById('qzb').innerHTML=`$ {
        prog
      }

      <p class="qz-num">Question $ {
        isQ1?'1': '2'
      }

      of 2</p><p class="qz-q">$ {
        qData.text
      }

      </p><div class="qz-opts">$ {
        qData.opts.map((o, i)=>`<button class="qz-opt" onclick="pickEQ(${i})" >$ {
            o.t
          }

          </button>`).join('')
      }

      </div>`;
    }

    function pickEQ(i) {
      document.querySelectorAll('.qz-opt')[i].classList.add('picked');

      if(eqStep==='q1') {
        eqChoice=EQ.q1.opts[i].next;

        setTimeout(()=> {
            eqStep='q2'; renderEQ();
          }

          , 400);
      }

      else {
        const o=EQ.q2[eqChoice].opts[i];
        setTimeout(()=>renderEQRes(o.rec, o.msg), 400);
      }
    }

    function renderEQRes(recId, personalMsg) {
      const f=FRAGS.find(x=>x.id===recId);

      document.getElementById('qzb').innerHTML=`<div class="qz-res"><span class="qz-for-you">For you,
      right now</span><p class="qz-res-name">$ {
        f.name
      }

      </p><span class="qz-res-tr">$ {
        f.tr
      }

      </span><div class="qz-personal">$ {
        personalMsg
      }

      </div><p class="qz-fragquote">$ {
        f.q
      }

      </p><div class="qz-res-acts"><button class="c-out" style="flex:none;padding:.95rem 2.2rem;" onclick="addBag('${f.id}',this)">Add to Bag — $$ {
        f.price
      }

      </button><button class="dp-add" style="padding:.95rem 2.2rem;" onclick="cPanel('qzp');openDetail('${f.id}')">Explore This Scent</button></div><button class="qz-restart" onclick="openQuiz()">Start Again</button></div>`;
    }
